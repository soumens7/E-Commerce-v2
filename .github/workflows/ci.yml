name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  NODE_VERSION: 20

jobs:
  client:
    name: Client (lint, test, build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: ./client
        run: npm ci

      - name: Run lint
        working-directory: ./client
        run: npm run lint --if-present

      - name: Run tests
        working-directory: ./client
        env:
          CI: true
        run: npm test --if-present -- --watchAll=false

      - name: Build client
        working-directory: ./client
        env:
          REACT_APP_API_URL: ${{ secrets.CLIENT_API_URL }}
        run: npm run build

      - name: Upload client build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-build
          path: client/build

  server:
    name: Server (lint, test)
    runs-on: ubuntu-latest
    needs: client

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: ./server
        run: npm ci

      - name: Run lint
        working-directory: ./server
        run: npm run lint --if-present

      - name: Run tests
        working-directory: ./server
        env:
          NODE_ENV: test
          CI: true
        run: npm test --if-present

      - name: Upload server test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-test-logs
          path: |
            server/test-results
            server/logs
          if-no-files-found: ignore
